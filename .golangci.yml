version: "2"

run:
  concurrency: 4
  timeout: 5m

linters:
  enable:
    - errcheck
    - gosec
    - staticcheck
    - unused
    - govet
    - ineffassign
    - errorlint
    - misspell
    - nolintlint
    - canonicalheader
    - contextcheck
    - revive
    - errname
  settings:
    gosec:
      excludes:
        - G101
        - G204
    misspell:
      locale: US
